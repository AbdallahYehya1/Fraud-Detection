# Local application database only. Bound to 127.0.0.1; credentials come from .env
# (git-ignored, generated by `python -m fraudinv db-env`).
name: fraudinv
services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: fraudinv_admin
      POSTGRES_PASSWORD: ${FRAUDINV_DB_ADMIN_PASSWORD:?run python -m fraudinv db-env}
      POSTGRES_DB: fraudinv
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fraudinv-pg:/var/lib/postgresql
    mem_limit: 768m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudinv_admin -d fraudinv"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  fraudinv-pg:
